<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; margin: 0; padding: 10px; background: #ffffff; }
    .controls { background: #f8fafc; padding: 14px; border-radius: 12px; border: 1px solid #e2e8f0; margin-bottom: 14px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .plot-card { height: 230px; background: #ffffff; border-radius: 12px; border: 1px solid #e2e8f0; }
    .slider-group { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-top: 8px; }
    label { font-weight: 600; color: #334155; font-size: 11px; }
    select, button { padding: 4px 10px; border-radius: 6px; border: 1px solid #cbd5e1; font-weight: 600; font-size: 11px; }
    button { background: #6366f1; color: white; border: none; cursor: pointer; }
    button:hover { background: #4f46e5; }
    .feller-status { font-size: 11px; font-weight: 700; margin-top: 6px; text-align: right; }
    .feller-satisfied { color: #10b981; }
    .feller-violated { color: #ef4444; }
  </style>
</head>
<body>

  <div class="controls">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
      <div>
        <label>Method: </label>
        <select id="sim-method" onchange="render()">
          <option value="truncated_euler" selected>Full Truncation Euler-Maruyama</option>
          <option value="chi_sq">Exact Non-Central Chi-Squared Sampling</option>
        </select>
      </div>
      <div style="display:flex; align-items:center; gap:12px;">
        <span id="feller-badge" class="feller-status feller-satisfied">Feller Condition: Satisfied</span>
        <button onclick="render()">Render / Refresh Plots</button>
      </div>
    </div>

    <div class="slider-group">
      <div>
        <label>Reversion Speed (κ): <span id="kappa-val" style="color:#6366f1;">2.0</span></label><br>
        <input type="range" id="kappa" min="0.1" max="5.0" value="2.0" step="0.1" style="width:100%" oninput="render()">
      </div>
      <div>
        <label>Long-Term Mean (θ): <span id="theta-val" style="color:#6366f1;">0.05</span></label><br>
        <input type="range" id="theta" min="0.01" max="0.20" value="0.05" step="0.01" style="width:100%" oninput="render()">
      </div>
      <div>
        <label>Volatility (σ): <span id="sigma-val" style="color:#6366f1;">0.15</span></label><br>
        <input type="range" id="sigma" min="0.02" max="0.50" value="0.15" step="0.01" style="width:100%" oninput="render()">
      </div>
      <div>
        <label>Sample Paths: <span id="paths-val" style="color:#6366f1;">5</span></label><br>
        <input type="range" id="paths" min="1" max="15" value="5" style="width:100%" oninput="render()">
      </div>
    </div>
  </div>

  <div class="grid">
    <div id="p-paths" class="plot-card"></div>
    <div id="p-cov" class="plot-card"></div>
    <div id="p-dist" class="plot-card"></div>
    <div id="p-mean" class="plot-card"></div>
  </div>

  <script>
  function randn() {
    let u = 0, v = 0;
    while(u === 0) u = Math.random();
    while(v === 0) v = Math.random();
    return Math.sqrt(-2.0 * Math.log(u)) * Math.cos(2.0 * Math.PI * v);
  }

  // Non-central chi-squared generator approximation
  function randncx2(df, ncp) {
    let z = randn();
    let x_val = (z + Math.sqrt(ncp)) ** 2;
    if (df > 1) {
      let sum = 0;
      for (let i = 0; i < df - 1; i++) {
        let g = randn();
        sum += g * g;
      }
      x_val += sum;
    }
    return x_val;
  }

  function render() {
    const kappa = parseFloat(document.getElementById('kappa').value);
    const theta = parseFloat(document.getElementById('theta').value);
    const sigma = parseFloat(document.getElementById('sigma').value);
    const P = parseInt(document.getElementById('paths').value);
    const method = document.getElementById('sim-method').value;
    const N = 200;

    document.getElementById('kappa-val').innerText = kappa.toFixed(1);
    document.getElementById('theta-val').innerText = theta.toFixed(2);
    document.getElementById('sigma-val').innerText = sigma.toFixed(2);
    document.getElementById('paths-val').innerText = P;

    // Check Feller Condition: 2 * kappa * theta > sigma^2
    const fellerLhs = 2 * kappa * theta;
    const fellerRhs = sigma * sigma;
    const fellerBadge = document.getElementById('feller-badge');
    if (fellerLhs > fellerRhs) {
      fellerBadge.innerText = `Feller Condition: Satisfied (${fellerLhs.toFixed(3)} > ${fellerRhs.toFixed(3)})`;
      fellerBadge.className = 'feller-status feller-satisfied';
    } else {
      fellerBadge.innerText = `Feller Condition: Violated (${fellerLhs.toFixed(3)} ≤ ${fellerRhs.toFixed(3)})`;
      fellerBadge.className = 'feller-status feller-violated';
    }

    const X0 = 0.05;
    const t = Array.from({length: N}, (_, i) => (i / (N - 1)) * 3.0);
    const dt = 3.0 / (N - 1);
    const sqrt_dt = Math.sqrt(dt);

    let X = Array.from({length: P}, () => new Array(N).fill(X0));

    for (let p = 0; p < P; p++) {
      if (method === 'chi_sq') {
        const d = (4 * kappa * theta) / (sigma * sigma);
        const c = (sigma * sigma * (1 - Math.exp(-kappa * dt))) / (4 * kappa);
        for (let i = 1; i < N; i++) {
          const ncp = (4 * kappa * X[p][i - 1] * Math.exp(-kappa * dt)) / (sigma * sigma * (1 - Math.exp(-kappa * dt)));
          X[p][i] = c * randncx2(d, ncp);
        }
      } else {
        // Full Truncation Euler-Maruyama Scheme
        for (let i = 1; i < N; i++) {
          let pos_x = Math.max(0, X[p][i - 1]);
          X[p][i] = X[p][i - 1] + kappa * (theta - pos_x) * dt + sigma * Math.sqrt(pos_x) * sqrt_dt * randn();
          X[p][i] = Math.max(0, X[p][i]); // Floor at 0
        }
      }
    }

    // Theoretical Mean Line E[X_t] = theta + (X0 - theta) * exp(-kappa * t)
    const theoreticalMean = t.map(ti => theta + (X0 - theta) * Math.exp(-kappa * ti));
    
    // Sample Mean across paths
    const sampleMean = t.map((_, i) => {
      let sum = 0;
      for (let p = 0; p < P; p++) sum += X[p][i];
      return sum / P;
    });

    // Covariance Matrix
    let empCov = Array.from({length: N}, () => new Array(N).fill(0));
    for (let i = 0; i < N; i++) {
      for (let j = 0; j < N; j++) {
        let sum = 0;
        for (let p = 0; p < P; p++) sum += (X[p][i] - theoreticalMean[i]) * (X[p][j] - theoreticalMean[j]);
        empCov[i][j] = sum / Math.max(1, P - 1);
      }
    }

    const layout = { 
      autosize: true, 
      margin: { t: 25, b: 35, l: 40, r: 15 },
      font: { size: 10 }
    };
    const config = { responsive: true, displayModeBar: false };

    // 1. Non-Negative Trajectories
    Plotly.react('p-paths', X.map(path => ({ x: t, y: path, mode: 'lines' })), { 
      ...layout, title: { text: 'CIR Process Trajectories X(t)', font: { size: 12, color: '#6366f1' } }, 
      showlegend: false, yaxis: { title: 'X(t)', rangemode: 'tozero' }, xaxis: { title: 't' } 
    }, config);

    // 2. Empirical Covariance Matrix
    Plotly.react('p-cov', [{ z: empCov, type: 'heatmap', colorscale: 'Viridis', showscale: true }], { 
      ...layout, title: { text: 'Empirical Covariance', font: { size: 12, color: '#6366f1' } }, 
      yaxis: { title: 't' }, xaxis: { title: 't' } 
    }, config);

    // 3. Non-Central Chi-Squared Terminal Distribution
    let terminalValues = X.map(path => path[N - 1]);
    Plotly.react('p-dist', [{ x: terminalValues, type: 'histogram', marker: { color: '#6366f1' } }], { 
      ...layout, title: { text: 'Terminal Density X(T)', font: { size: 12, color: '#6366f1' } }, 
      xaxis: { title: 'X(T)' }, yaxis: { title: 'Count' } 
    }, config);

    // 4. Mean Reversion Profile
    Plotly.react('p-mean', [
      { x: t, y: theoreticalMean, mode: 'lines', name: 'Theoretical E[X_t]', line: { color: '#10b981', width: 2.5 } },
      { x: t, y: sampleMean, mode: 'lines', name: 'Sample Mean', line: { color: '#ef4444', width: 2, dash: 'dot' } }
    ], { 
      ...layout, title: { text: 'Expected Mean Reversion E[X_t]', font: { size: 12, color: '#6366f1' } }, 
      showlegend: true, legend: { orientation: 'h', x: 0, y: -0.3, font: { size: 9 } },
      yaxis: { title: 'E[X_t]' }, xaxis: { title: 't' } 
    }, config);
  }

  window.onload = function() { setTimeout(render, 100); };
  </script>
</body>
</html>
